<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" role="img" aria-label="Tracercoin (TFX) — a proof-of-work memory chain">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5eead4"/>
      <stop offset="1" stop-color="#38bdf8"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="0%" r="75%">
      <stop offset="0" stop-color="#38bdf8" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#38bdf8" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M48 0H0V48" fill="none" stroke="#38bdf8" stroke-opacity="0.06" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1200" height="630" fill="#0a0e14"/>
  <rect width="1200" height="630" fill="url(#grid)"/>
  <rect width="1200" height="630" fill="url(#glow)"/>

  <g transform="translate(96,150)">
    <g transform="translate(0,-6)">
      <circle cx="34" cy="34" r="30" fill="none" stroke="url(#g)" stroke-width="4.5"/>
      <path d="M34 10 v48 M14 24 h40 M14 44 h40" fill="none" stroke="url(#g)" stroke-width="4.5" stroke-linecap="round"/>
    </g>
    <text x="92" y="52" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="40" font-weight="700" fill="#e7eef6">Tracercoin
      <tspan fill="#5eead4" font-size="26" font-family="monospace" dx="12">TFX</tspan>
    </text>
  </g>

  <text x="96" y="360" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="92" font-weight="700" fill="#e7eef6" letter-spacing="-2">A proof-of-work</text>
  <text x="96" y="452" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="92" font-weight="700" fill="url(#g)" letter-spacing="-2">memory chain.</text>

  <text x="96" y="536" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="30" fill="#a9bacb">File a fingerprint. Prove it existed. Verify forever.</text>
</svg>
